<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <title>Offline | N-Bills</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0a0a0a; color: #fafafa; font-family: system-ui, sans-serif; }
    main { max-width: 440px; text-align: center; }
    p { line-height: 1.6; color: #ccc; }
    button { padding: 12px 24px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; background: #fff; color: #111; }
    button:focus-visible { outline: 3px solid #aaa; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>N-Bills</p>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to open this page and access your latest bills and customer information.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
